services:
  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
      args:
        - VITE_VENTAS_URL=${VITE_VENTAS_URL}
        - VITE_DESPACHOS_URL=${VITE_DESPACHOS_URL}
    container_name: innovatech_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - frontend_net

networks:
  frontend_net:
    name: innovatech_frontend_net
    driver: bridge
