server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API Ventas
    location /api/ventas/ {
        rewrite ^/api/ventas/(.*) /api/v1/ventas/$1 break;
        proxy_pass http://10.0.2.10:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/ventas {
        rewrite ^/api/ventas$ /api/v1/ventas break;
        proxy_pass http://10.0.2.10:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy API Despachos
    location /api/despachos/ {
        rewrite ^/api/despachos/(.*) /api/v1/despachos/$1 break;
        proxy_pass http://10.0.2.10:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/despachos {
        rewrite ^/api/despachos$ /api/v1/despachos break;
        proxy_pass http://10.0.2.10:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    server_tokens off;
}
