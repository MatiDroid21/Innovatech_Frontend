server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ventas {
        rewrite ^/api/ventas/$ /api/v1/ventas break;
        rewrite ^/api/ventas/(.+)$ /api/v1/ventas/$1 break;
        proxy_pass http://ventas-service:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/despachos {
        rewrite ^/api/despachos/$ /api/v1/despachos break;
        rewrite ^/api/despachos/(.+)$ /api/v1/despachos/$1 break;
        proxy_pass http://despachos-service:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    server_tokens off;
}
