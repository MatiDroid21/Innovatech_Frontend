server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API Ventas — colección (GET /api/ventas o /api/ventas/)
    location ~ ^/api/ventas/?$ {
        proxy_pass http://10.0.2.10:8080/api/v1/ventas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy API Ventas — recurso específico (GET /api/ventas/123)
    location ~ ^/api/ventas/(.+)$ {
        proxy_pass http://10.0.2.10:8080/api/v1/ventas/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy API Despachos — colección
    location ~ ^/api/despachos/?$ {
        proxy_pass http://10.0.2.10:8081/api/v1/despachos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy API Despachos — recurso específico
    location ~ ^/api/despachos/(.+)$ {
        proxy_pass http://10.0.2.10:8081/api/v1/despachos/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    server_tokens off;
}